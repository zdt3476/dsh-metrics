name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24', '26']
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck and tests
        run: pnpm test

      - name: Verify build bundle
        run: pnpm run build

      # 提交的 lib/ 必须与源码构建结果一致，防止「改了源码忘了重新构建」被发布出去
      - name: Assert lib/ is up to date
        run: |
          if ! git diff --exit-code -- lib; then
            echo "::error::lib/ 与 src 构建结果不一致：请先 pnpm run build 再提交"
            exit 1
          fi
