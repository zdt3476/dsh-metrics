name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # OIDC 令牌用于 npm trusted publishing，无需长期 token
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          # 写入 registry 配置；npm CLI 依赖 registry 配置齐全才走 OIDC 交换
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test and build check
        run: pnpm test && pnpm run build

      - name: Assert tag matches package.json version
        # 手动从 main 触发时没有 tag，跳过校验（版本由 package.json 决定）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "releasing v$version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 标签被强制更新时会再次触发本流程，已存在的 Release 只需更新而不是创建
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，跳过创建"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@zdt3476/dsh-metrics@$version" version >/dev/null 2>&1; then
            echo "npm 上已存在 @zdt3476/dsh-metrics@$version，跳过发布"
            exit 0
          fi
          # lib/ 已在上面构建完成，避免 prepack 重复构建
          npm publish --ignore-scripts --access public
